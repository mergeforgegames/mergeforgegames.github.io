<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>MergeForge Games</title>
<meta name="description" content="MergeForge Games — bağımsız Türk mobil oyun stüdyosu. Elementa: periyodik tablodan silah yap, arenada hayatta kal.">
<link rel="icon" href="https://mergeforgegames.github.io/elementa/favicon.svg" type="image/svg+xml">
<link rel="canonical" href="https://mergeforgegames.github.io/">
<style>
  :root { --bg:#070912; --ink:#eaf0ff; --dim:rgba(234,240,255,.62); --a:#4ee0ff; --b:#a05cff; }
  * { box-sizing:border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
         background:var(--bg); color:var(--ink);
         font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  main { width:100%; max-width:520px; text-align:center; }
  h1 { font-size:clamp(28px,7vw,40px); margin:0 0 6px; letter-spacing:.02em; }
  p  { color:var(--dim); line-height:1.65; margin:0 0 26px; }
  .tile { width:92px; height:92px; margin:0 auto 20px; border-radius:22px;
          background:linear-gradient(135deg,var(--a),var(--b));
          display:grid; place-items:center; color:#04121a; font-weight:900;
          box-shadow:0 10px 40px rgba(78,224,255,.22); }
  .tile b { font-size:34px; line-height:1; }
  .tile i { display:block; font-size:12px; font-style:normal; opacity:.6; }
  a.btn { display:block; padding:15px 20px; border-radius:14px; text-decoration:none;
          font-weight:800; margin-bottom:12px; }
  .pri { background:linear-gradient(135deg,var(--a),var(--b)); color:#04121a; }
  .sec { border:1px solid rgba(234,240,255,.16); color:var(--ink); }
  footer { margin-top:28px; font-size:13px; color:var(--dim); }
  footer a { color:var(--dim); }
</style>
</head>
<body>
<main>
  <div class="tile"><div><i>118</i><b>Ea</b></div></div>
  <h1>MergeForge Games</h1>
  <p>Bağımsız Türk mobil oyun stüdyosu.</p>
  <a class="btn pri" href="https://play.google.com/store/apps/details?id=com.mergeforgegames.elementa">Elementa'yı Google Play'den indir</a>
  <a class="btn sec" href="https://mergeforgegames.github.io/elementa/">Elementa hakkında</a>
  <footer>
    <a href="https://www.instagram.com/mergeforgegames/" rel="me">Instagram</a> ·
    <a href="https://github.com/mergeforgegames" rel="me">GitHub</a> ·
    <a href="https://sites.google.com/view/mergeforgegames">Gizlilik</a>
  </footer>
</main>
</body>
</html>
